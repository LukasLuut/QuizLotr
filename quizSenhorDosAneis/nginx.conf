server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Arquivos com hash no nome podem ficar em cache por muito tempo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota do React Router cai no index.html (F5 em /profile funciona)
  location / {
    try_files $uri /index.html;
  }
}
