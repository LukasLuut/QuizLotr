name: Demo no GitHub Pages

# Versão demo (só front-end, sem API): publicada a cada push na branch versao-demo
on:
  push:
    branches: [versao-demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quizSenhorDosAneis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: quizSenhorDosAneis/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      # vídeos em 720p só no site da demo (carrega mais rápido)
      - run: bash scripts/demo-videos.sh
      # site em https://<usuário>.github.io/<repositório>/
      - run: npm run build:demo
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quizSenhorDosAneis/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
