name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (typecheck, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retorno-do-dev
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quiz_lotr_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_NAME: quiz_lotr_test
      JWT_SECRET: segredo-de-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: retorno-do-dev/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web (lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quizSenhorDosAneis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: quizSenhorDosAneis/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # build no Linux pega imports com maiúsculas/minúsculas erradas
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quiz_lotr
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_NAME: quiz_lotr
      JWT_SECRET: segredo-de-ci
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: retorno-do-dev
      - run: npm ci
        working-directory: quizSenhorDosAneis
      - run: npx playwright install --with-deps chromium
        working-directory: quizSenhorDosAneis
      - run: npx playwright test
        working-directory: quizSenhorDosAneis
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: quizSenhorDosAneis/playwright-report
